name: Deploy GitHub Pages

# Project Pages via Actions. Needs a public repo (this token cannot change
# visibility or enable Pages: REST 403 Resource not accessible by integration).
# After the repo is public, Settings → Pages → Source = GitHub Actions.
# Do not target cbrit.github.io root or Whatley sites.
# Until Project Pages is enabled, the phone URL is the user-site subdirectory:
# https://cbrit.github.io/scripture-outliner/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/generate-icons.py
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
        env:
          VITE_BASE: /scripture-outliner/
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
